#
# Start a self-hosted EC2 runner, retrying with backoff when the region has no
# capacity for the requested instance type.
#
# Every workflow that needs an EC2 runner calls this instead of inlining the
# machulav action, so the retry policy (attempt count, backoff, the AZ sweep,
# the action version, the IAM role) lives in exactly one place and cannot drift
# between tests.yml, nightly.yml, publish.yml and gsplat-l4-tests.yml.
#
# Every caller on the way here passes `secrets: inherit`. GitHub only gives a
# reusable workflow's jobs the secrets of an environment they declare (here
# the runner App key in ci-aws) when each caller above them uses `secrets: inherit`;
# without it the key arrives empty. Verified in openvdb/fvdb-ok-to-test-sandbox.
name: Start EC2 Runner

on:
  workflow_call:
    inputs:
      instance-type:
        description: EC2 instance type to launch, e.g. m6a.8xlarge or g6.xlarge.
        type: string
        required: true
      az-config:
        description: >-
          JSON array of availability-zone configs, tried in order by the action
          within a single attempt. Usually needs.versions.outputs.aws-*-az-config.
        type: string
        required: true
      aws-role:
        description: IAM role to assume via OIDC. Can only start and stop runners.
        type: string
        required: false
        default: arn:aws:iam::420032683002:role/openvdb-fvdb-github-actions-ec2-runners
      aws-region:
        description: AWS region to launch in.
        type: string
        required: false
        default: us-east-2
      backoff-seconds:
        description: >-
          Seconds to wait after the first failed attempt. The second wait is
          twice this, so the default gives 90s then 180s between three attempts.
        type: number
        required: false
        default: 90
    outputs:
      label:
        description: Runner label to pass as `runs-on` in the job being provisioned.
        value: ${{ jobs.start.outputs.label }}
      ec2-instance-id:
        description: Instance id, to be handed back to stop-ec2-runner.yml.
        value: ${{ jobs.start.outputs.ec2-instance-id }}

permissions:
  contents: read
  id-token: write # Need ID token write permission to use OIDC

jobs:
  start:
    name: Start EC2 runner
    runs-on: ubuntu-latest
    # The runner role (the aws-role default above) trusts only OIDC tokens
    # whose subject names the ci-aws environment, and a job's token names an
    # environment only if the job declares one. ci-aws has no required
    # reviewers; its deployment-branch policy limits which refs can start a
    # runner. Approval of external PRs happens earlier, in approval-gate.yml.
    #
    # deployment: false keeps the environment (its deployment-branch policy
    # still applies and the OIDC subject still names ci-aws) but records no
    # deployment, so PRs are not filled with "deployed to ci-aws" events.
    # Both were verified in openvdb/fvdb-test.
    environment:
      name: ci-aws
      deployment: false
    # Taken from the attempt that actually SUCCEEDED -- see the select step
    # below for why "first non-empty" is not the same thing.
    outputs:
      label: ${{ steps.select.outputs.label }}
      ec2-instance-id: ${{ steps.select.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
          # 900s is the STS minimum. The session only has to outlive one
          # launch attempt, so a leaked session is useful for 15 minutes
          # instead of the default hour.
          role-duration-seconds: 900

      # The runner action needs a token that can register and remove this
      # repository's self-hosted runners (Administration: write). It comes from
      # the fvdb-ec2-runners GitHub App: minted for this job, limited to this
      # repository, and revoked when the job ends. The App's private key is a
      # secret of the ci-aws environment, so only jobs that declare ci-aws, on
      # refs its deployment-branch policy allows, can read it.
      - name: Mint a runner-registration token
        id: runner-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RUNNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RUNNER_APP_KEY }}
          permission-administration: write

      # Every instance is tagged with the repository and run that launched it.
      # The runner role's policy refuses RunInstances without the
      # GitHubRepository tag. The action applies these tags at launch, to the
      # instance and its volume.
      - name: Compose EC2 resource tags
        id: tags
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          TAGS=$(jq -c -n --arg run_id "${RUN_ID}" --arg repo "${REPO}" \
            '[{"Key": "GitHubRunId", "Value": $run_id}, {"Key": "GitHubRepository", "Value": $repo}]')
          echo "Tags: ${TAGS}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Start EC2 runner (attempt 1)
        id: a1
        continue-on-error: true
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.runner-app-token.outputs.token }}
          ec2-instance-type: ${{ inputs.instance-type }}
          availability-zones-config: ${{ inputs.az-config }}
          aws-resource-tags: ${{ steps.tags.outputs.tags }}

      # The action publishes its outputs as soon as the instance launches, i.e.
      # BEFORE it waits for the runner to register. So a failed attempt can still
      # have left an instance running -- terminate it rather than leak it.
      - name: Clean up the instance left behind by attempt 1
        if: steps.a1.outcome == 'failure' && steps.a1.outputs.ec2-instance-id != ''
        continue-on-error: true
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.runner-app-token.outputs.token }}
          label: ${{ steps.a1.outputs.label }}
          ec2-instance-id: ${{ steps.a1.outputs.ec2-instance-id }}

      - name: Back off before attempt 2
        if: steps.a1.outcome == 'failure'
        env:
          BACKOFF: ${{ inputs.backoff-seconds }}
        run: |
          echo "::warning::Runner start attempt 1 found no capacity; retrying in ${BACKOFF}s."
          sleep "${BACKOFF}"

      # Each 15-minute session covers one attempt and its clean-up. Three
      # attempts plus the back-off waits can outlast a single session, so
      # every retry starts with a fresh one.
      - name: Refresh AWS credentials for attempt 2
        if: steps.a1.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
          role-duration-seconds: 900

      - name: Start EC2 runner (attempt 2)
        id: a2
        if: steps.a1.outcome == 'failure'
        continue-on-error: true
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.runner-app-token.outputs.token }}
          ec2-instance-type: ${{ inputs.instance-type }}
          availability-zones-config: ${{ inputs.az-config }}
          aws-resource-tags: ${{ steps.tags.outputs.tags }}

      # The action publishes its outputs as soon as the instance launches, i.e.
      # BEFORE it waits for the runner to register. So a failed attempt can still
      # have left an instance running -- terminate it rather than leak it.
      - name: Clean up the instance left behind by attempt 2
        if: steps.a2.outcome == 'failure' && steps.a2.outputs.ec2-instance-id != ''
        continue-on-error: true
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.runner-app-token.outputs.token }}
          label: ${{ steps.a2.outputs.label }}
          ec2-instance-id: ${{ steps.a2.outputs.ec2-instance-id }}

      - name: Back off before attempt 3
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        env:
          BACKOFF: ${{ inputs.backoff-seconds }}
        run: |
          echo "::warning::Runner start attempt 2 found no capacity; retrying in $((BACKOFF * 2))s."
          sleep "$((BACKOFF * 2))"

      - name: Refresh AWS credentials for attempt 3
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
          role-duration-seconds: 900

      - name: Start EC2 runner (attempt 3)
        id: a3
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        continue-on-error: true
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.runner-app-token.outputs.token }}
          ec2-instance-type: ${{ inputs.instance-type }}
          availability-zones-config: ${{ inputs.az-config }}
          aws-resource-tags: ${{ steps.tags.outputs.tags }}

      # The action publishes its outputs as soon as the instance launches, i.e.
      # BEFORE it waits for the runner to register. So a failed attempt can still
      # have left an instance running -- terminate it rather than leak it.
      - name: Clean up the instance left behind by attempt 3
        if: steps.a3.outcome == 'failure' && steps.a3.outputs.ec2-instance-id != ''
        continue-on-error: true
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.runner-app-token.outputs.token }}
          label: ${{ steps.a3.outputs.label }}
          ec2-instance-id: ${{ steps.a3.outputs.ec2-instance-id }}

      # Pick the outputs of the attempt that succeeded. This must key on the
      # step OUTCOME, not on which output is non-empty: an attempt whose
      # instance launched but never registered a runner fails with its outputs
      # already populated, so "first non-empty" would hand back a dead label --
      # the dependent job would then queue against a runner that never appears
      # instead of failing fast.
      - name: Select the successful attempt
        id: select
        env:
          INSTANCE_TYPE: ${{ inputs.instance-type }}
          A1_OUTCOME: ${{ steps.a1.outcome }}
          A1_LABEL: ${{ steps.a1.outputs.label }}
          A1_ID: ${{ steps.a1.outputs.ec2-instance-id }}
          A2_OUTCOME: ${{ steps.a2.outcome }}
          A2_LABEL: ${{ steps.a2.outputs.label }}
          A2_ID: ${{ steps.a2.outputs.ec2-instance-id }}
          A3_OUTCOME: ${{ steps.a3.outcome }}
          A3_LABEL: ${{ steps.a3.outputs.label }}
          A3_ID: ${{ steps.a3.outputs.ec2-instance-id }}
        run: |
          if [ "${A1_OUTCOME}" = "success" ]; then
            LABEL="${A1_LABEL}"; ID="${A1_ID}"; WON=1
          elif [ "${A2_OUTCOME}" = "success" ]; then
            LABEL="${A2_LABEL}"; ID="${A2_ID}"; WON=2
          elif [ "${A3_OUTCOME}" = "success" ]; then
            LABEL="${A3_LABEL}"; ID="${A3_ID}"; WON=3
          else
            echo "::error::Could not obtain a ${INSTANCE_TYPE} instance after 3 attempts across every configured availability zone; the region is likely out of this instance type."
            exit 1
          fi
          echo "Runner provisioned on attempt ${WON}: ${LABEL} (${ID})"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "ec2-instance-id=${ID}" >> "$GITHUB_OUTPUT"
