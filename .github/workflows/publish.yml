name: Publish fVDB Reality Capture Package

on:
  release:
    types: [published]
  push:
    branches:
      - 'release/v[0-9]*'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
      publish_target:
        description: "Publish target: testpypi | s3 | release | none"
        required: false
        default: "testpypi"
      run_validation:
        description: "Run GPU validation tests on built package"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. id-token: write (AWS OIDC, PyPI trusted publishing) is
# granted per job, so the build job, which runs the code of the chosen branch,
# cannot request cloud credentials.
permissions:
  contents: read

jobs:
  versions:
    name: Load versions
    uses: ./.github/workflows/load-versions.yml

  ##############################################################################
  # DETERMINE PUBLISH ROUTING
  ##############################################################################
  pr-flags:
    name: Determine publish flags
    runs-on: ubuntu-latest
    outputs:
      s3: ${{ steps.flags.outputs.s3 }}
      pypi: ${{ steps.flags.outputs.pypi }}
      is_release: ${{ steps.flags.outputs.is_release }}
      release_push: ${{ steps.flags.outputs.release_push }}
    steps:
      - name: Compute publish routing flags
        id: flags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const eventName = context.eventName;
            const isPush = eventName === 'push';
            const isReleaseEvent = eventName === 'release';
            const target = '${{ inputs.publish_target }}';

            let s3 = false;
            let pypi = false;
            let isRelease = false;
            let releasePush = false;

            if (isReleaseEvent || target === 'release') {
              s3 = true;
              pypi = true;
              isRelease = true;
            } else if (isPush) {
              s3 = true;
              releasePush = true;
            } else if (target === 'testpypi') {
              pypi = true;
            } else if (target === 's3') {
              s3 = true;
            }

            core.setOutput('s3', s3 ? 'true' : 'false');
            core.setOutput('pypi', pypi ? 'true' : 'false');
            core.setOutput('is_release', isRelease ? 'true' : 'false');
            core.setOutput('release_push', releasePush ? 'true' : 'false');

  ##############################################################################
  # BUILD PACKAGE
  ##############################################################################
  fvdb-rc-build:
    name: Build fVDB Reality Capture package
    needs: pr-flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.7.5"

      - name: Set up Python
        run: |
          uv python install 3.12
          uv venv

      - name: Add post-release version for TestPyPI
        if: ${{ needs.pr-flags.outputs.is_release == 'false' && needs.pr-flags.outputs.pypi == 'true' }}
        run: |
          VERSION_LINE=$(grep '^version *= *"' pyproject.toml)
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if [ "${GITHUB_RUN_NUMBER:-${{ github.run_number }}}" -gt 1 ]; then
            NEW_VERSION="${VERSION}.post${GITHUB_RUN_NUMBER:-${{ github.run_number }}}"
            sed -i -E "s/^version *= *\"[^\"]+\"/version = \"${NEW_VERSION}\"/" pyproject.toml
            echo "Updated version to $NEW_VERSION"
          else
            echo "Version unchanged: $VERSION"
          fi
          grep '^version' pyproject.toml

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fvdb-rc-dist
          path: dist/
          retention-days: 7

  ##############################################################################
  # PUBLISH TO PYPI / TESTPYPI
  ##############################################################################
  publish-dist:
    name: Publish to PyPI/TestPyPI
    needs:
      - pr-flags
      - fvdb-rc-build
    if: ${{ !cancelled() && needs.fvdb-rc-build.result == 'success' && needs.pr-flags.outputs.pypi == 'true' }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ (needs.pr-flags.outputs.is_release == 'true' && 'pypi') || 'testpypi' }}
      url: ${{ (needs.pr-flags.outputs.is_release == 'true' && 'https://pypi.org/p/fvdb-reality-capture') || 'https://test.pypi.org/p/fvdb-reality-capture' }}

    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fvdb-rc-dist
          path: dist

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ (needs.pr-flags.outputs.is_release == 'true' && 'https://upload.pypi.org/legacy/') || 'https://test.pypi.org/legacy/' }}
          verbose: true

  ##############################################################################
  # PUBLISH TO S3 SIMPLE INDEX
  ##############################################################################
  publish-to-s3:
    permissions:
      id-token: write # AWS OIDC, to upload to the package index
    name: Publish to S3 Simple Index
    needs: [pr-flags, fvdb-rc-build]
    if: ${{ !cancelled() && needs.pr-flags.outputs.s3 == 'true' && needs.fvdb-rc-build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: fvdb-packages
      SIMPLE_PREFIX: ${{ needs.pr-flags.outputs.is_release == 'true' && 'simple' || 'simple-staging' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::420032683002:role/openvdb-fvdb-github-actions-role
          aws-region: us-east-2

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fvdb-rc-dist
          path: dist

      - name: Determine normalized project name
        id: proj
        run: |
          set -euo pipefail
          shopt -s nullglob
          FIRST_WHL=$(ls dist/*.whl | head -n1)
          if [ -z "${FIRST_WHL:-}" ]; then
            echo "No wheels found in dist/" >&2; exit 1
          fi
          BASE=$(basename "$FIRST_WHL")
          PROJECT=${BASE%%-*}
          NORM=$(echo "$PROJECT" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')
          echo "project_name=$PROJECT" >> $GITHUB_OUTPUT
          echo "normalized=$NORM" >> $GITHUB_OUTPUT
          echo "Project: $PROJECT, Normalized: $NORM"

      - name: Prune staging wheels older than 30 days
        if: ${{ env.SIMPLE_PREFIX == 'simple-staging' }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '30 days ago' '+%Y-%m-%d')
          echo "Pruning staging wheels uploaded before $CUTOFF"
          LISTING=$(aws s3 ls "s3://${S3_BUCKET}/${SIMPLE_PREFIX}/${{ steps.proj.outputs.normalized }}/" 2>/dev/null || true)
          if [ -z "$LISTING" ]; then
            echo "No existing wheels found -- nothing to prune"
            exit 0
          fi
          DELETED=0
          while read -r line; do
            DATE_PART=$(echo "$line" | awk '{print $1}')
            FILE_PART=$(echo "$line" | awk '{print $4}')
            if [[ "$FILE_PART" == *.whl ]] && [[ "$DATE_PART" < "$CUTOFF" ]]; then
              echo "Removing: $FILE_PART (uploaded $DATE_PART)"
              aws s3 rm "s3://${S3_BUCKET}/${SIMPLE_PREFIX}/${{ steps.proj.outputs.normalized }}/$FILE_PART" --only-show-errors
              DELETED=$((DELETED + 1))
            fi
          done <<< "$LISTING"
          echo "Pruned $DELETED old staging wheel(s)"

      - name: Check out the publish script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
          sparse-checkout: .github/scripts/publish_simple_index.py
          sparse-checkout-cone-mode: false

      # Uploads the wheels and rewrites the project index. Hashes of wheels not
      # built in this run are copied from the current index, never recomputed
      # from S3, so a wheel replaced in S3 fails pip's hash check instead of
      # being vouched for. Release wheels (prefix simple) are write-once.
      - name: Upload wheels and update the project index
        env:
          PROJECT: ${{ steps.proj.outputs.normalized }}
          TITLE: Links for ${{ steps.proj.outputs.project_name }}
        run: |
          python3 src/.github/scripts/publish_simple_index.py \
            --bucket "$S3_BUCKET" --prefix "$SIMPLE_PREFIX" --project "$PROJECT" \
            --title "$TITLE" --dist dist

      - name: Generate root simple index.html
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          ROOT_INDEX="$TMPDIR/index.html"
          projects=$(aws s3 ls "s3://${S3_BUCKET}/${SIMPLE_PREFIX}/" | awk '{print $2}' | sed 's:/$::')
          TITLE="Simple index"
          {
            echo "<!DOCTYPE html>";
            echo "<html><head><meta charset=\"utf-8\"><title>${TITLE}</title></head><body>";
            echo "<h1>${TITLE}</h1>";
            for p in $projects; do
              echo "<a href=\"${p}/\">${p}</a><br/>";
            done;
            echo "</body></html>";
          } > "$ROOT_INDEX"
          aws s3 cp "$ROOT_INDEX" "s3://${S3_BUCKET}/${SIMPLE_PREFIX}/index.html" --content-type text/html --only-show-errors

  ##############################################################################
  # GPU VALIDATION: DISCOVER FVDB-CORE VERSIONS + SMOKE TEST + UNIT TESTS
  ##############################################################################
  discover-fvdb-core:
    permissions:
      id-token: write # AWS OIDC, to list and download fvdb-core staging wheels
    name: Discover fvdb-core versions from S3 staging
    needs: [pr-flags, fvdb-rc-build]
    if: ${{ !cancelled() && needs.fvdb-rc-build.result == 'success' && (needs.pr-flags.outputs.release_push == 'true' || inputs.run_validation == true) }}
    runs-on: ubuntu-latest
    outputs:
      torch-version: ${{ steps.discover.outputs.torch_version }}
      cuda-tag: ${{ steps.discover.outputs.cuda_tag }}
      cuda-image-tag: ${{ steps.discover.outputs.cuda_image_tag }}
      pytorch-index: ${{ steps.discover.outputs.pytorch_index }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::420032683002:role/openvdb-fvdb-github-actions-role
          aws-region: us-east-2
      - name: Discover fvdb-core versions from S3 staging
        id: discover
        run: |
          set -euo pipefail
          LISTING=$(aws s3 ls s3://fvdb-packages/simple-staging/fvdb-core/ 2>/dev/null | grep '\.whl$' | awk '{print $4}' || true)
          if [ -z "$LISTING" ]; then
            echo "ERROR: No fvdb-core wheels found in S3 staging" >&2
            exit 1
          fi
          echo "Available wheels:"
          echo "$LISTING"

          # Pick the first wheel (any Python version) to extract version tags
          WHEEL=$(echo "$LISTING" | head -1)
          echo "Selected wheel: $WHEEL"

          # Extract local version tag: +pt210.cu128
          LOCAL_TAG=$(echo "$WHEEL" | grep -oP '\+pt\d+\.cu\d+' || true)
          if [ -z "$LOCAL_TAG" ]; then
            echo "ERROR: Could not parse local version tag from wheel: $WHEEL" >&2
            exit 1
          fi
          echo "Local version tag: $LOCAL_TAG"

          # Parse torch version: pt210 -> 2.10.0
          PT_DIGITS=$(echo "$LOCAL_TAG" | grep -oP 'pt\K\d+')
          TORCH_MAJOR=${PT_DIGITS:0:1}
          TORCH_MINOR=${PT_DIGITS:1}
          TORCH_VERSION="${TORCH_MAJOR}.${TORCH_MINOR}.0"

          # Parse CUDA tag: cu128
          CUDA_TAG=$(echo "$LOCAL_TAG" | grep -oP 'cu\d+')

          # Map CUDA tag to container image tag
          case "$CUDA_TAG" in
            cu118) CUDA_IMAGE_TAG="11.8.0" ;;
            cu121) CUDA_IMAGE_TAG="12.1.1" ;;
            cu124) CUDA_IMAGE_TAG="12.4.1" ;;
            cu128) CUDA_IMAGE_TAG="12.8.1" ;;
            cu130) CUDA_IMAGE_TAG="13.0.2" ;;
            *) echo "WARNING: Unknown CUDA tag $CUDA_TAG, defaulting to 12.8.1" >&2
               CUDA_IMAGE_TAG="12.8.1" ;;
          esac

          PYTORCH_INDEX="https://download.pytorch.org/whl/${CUDA_TAG}"

          # Extract base version (e.g. 0.4.0) from the wheel filename
          CORE_VERSION=$(echo "$WHEEL" | grep -oP 'fvdb_core-\K[0-9]+\.[0-9]+\.[0-9]+')

          LOCAL_TAG_CLEAN=$(echo "$LOCAL_TAG" | sed 's/^+//')

          # Find the actual cp312 wheel from the listing (platform tag varies across builds)
          CP312_WHEEL=$(echo "$LISTING" | grep "fvdb_core-${CORE_VERSION}+${LOCAL_TAG_CLEAN}-cp312-cp312-" | head -1)
          if [ -z "$CP312_WHEEL" ]; then
            echo "ERROR: No cp312 fvdb-core wheel found for version ${CORE_VERSION}+${LOCAL_TAG_CLEAN}" >&2
            echo "Available wheels:" >&2
            echo "$LISTING" >&2
            exit 1
          fi

          # Download the wheel here, with the job's AWS credentials, and pass
          # it to the validation jobs as an artifact. The bucket is not
          # publicly readable (the public index is served through
          # CloudFront), and CloudFront may still be caching an older staging
          # wheel uploaded under the same name, so neither a direct S3 URL
          # nor a CloudFront URL is reliable here.
          mkdir -p core-wheel
          aws s3 cp "s3://fvdb-packages/simple-staging/fvdb-core/${CP312_WHEEL}" core-wheel/ --only-show-errors

          echo "Discovered: torch=$TORCH_VERSION cuda=$CUDA_TAG image=$CUDA_IMAGE_TAG"
          echo "Core wheel: $CP312_WHEEL"
          echo "torch_version=$TORCH_VERSION" >> $GITHUB_OUTPUT
          echo "cuda_tag=$CUDA_TAG" >> $GITHUB_OUTPUT
          echo "cuda_image_tag=$CUDA_IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "pytorch_index=$PYTORCH_INDEX" >> $GITHUB_OUTPUT

      - name: Upload the fvdb-core wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fvdb-core-staging-wheel
          path: core-wheel/*.whl
          if-no-files-found: error
          retention-days: 7

  start-validation-runner:
    permissions:
      id-token: write # AWS OIDC, to start or stop the runner
    name: Start GPU EC2 runner for validation
    needs: [pr-flags, fvdb-rc-build, discover-fvdb-core, versions]
    if: ${{ !cancelled() && needs.discover-fvdb-core.result == 'success' }}
    uses: ./.github/workflows/start-ec2-runner.yml
    secrets: inherit # zizmor: ignore[secrets-inherit] the runner App key reaches the runner jobs this way; see start-ec2-runner.yml
    with:
      instance-type: g6.xlarge
      az-config: ${{ needs.versions.outputs.aws-gpu-az-config }}

  validate-smoke-test:
    name: Smoke test fvdb-core + fvdb-reality-capture
    needs: [start-validation-runner, discover-fvdb-core, fvdb-rc-build, pr-flags]
    if: ${{ !cancelled() && needs.start-validation-runner.result == 'success' }}
    runs-on: ${{ needs.start-validation-runner.outputs.label }}
    container:
      image: nvidia/cuda:${{ needs.discover-fvdb-core.outputs.cuda-image-tag }}-base-rockylinux8
      env:
        PYTHONPATH: ""
      options: --rm
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Install prerequisites
        run: dnf install -y git wget procps-ng findutils

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.7.5"

      - name: Set up Python
        run: |
          uv python install 3.12
          uv venv

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fvdb-rc-dist
          path: dist

      - name: Download the fvdb-core wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fvdb-core-staging-wheel
          path: core-wheel

      - name: Install fvdb-core from S3 staging and fvdb-reality-capture wheel
        run: |
          uv pip install --no-cache \
            torch==${{ needs.discover-fvdb-core.outputs.torch-version }} torchvision \
            --extra-index-url ${{ needs.discover-fvdb-core.outputs.pytorch-index }}
          uv pip install --no-cache core-wheel/fvdb_core-*.whl
          uv pip install dist/fvdb_reality_capture-*.whl

      - name: Smoke test
        run: |
          uv run python3 -c "
          import fvdb
          import torch
          print(f'fvdb-core version: {fvdb.__version__}')
          print(f'torch version: {torch.__version__}')
          print(f'CUDA available: {torch.cuda.is_available()}')
          assert torch.cuda.is_available(), 'CUDA not available'

          ijk = fvdb.JaggedTensor([torch.tensor([[0,0,0],[1,1,1]], device='cuda')])
          grid = fvdb.GridBatch.from_ijk(ijk)
          print(f'GridBatch: {grid.total_voxels} voxels on {grid.device}')

          import fvdb_reality_capture
          print(f'fvdb-reality-capture version: {fvdb_reality_capture.__version__}')
          print('Smoke test PASSED')
          "

  validate-unit-tests:
    permissions:
      contents: read
      id-token: write # AWS OIDC, for the S3 unit tests
    name: Full unit tests
    # Runs the code of the chosen branch with AWS credentials, so it uses a
    # role that can only read fvdb-data/fvdb-reality-capture and write the S3
    # unit test's scratch key (no access to the package index). That role
    # trusts only tokens issued for the ci-s3-tests environment, which only
    # this job and the unit benchmark job in nightly.yml declare; ci-s3-tests limits it to main, release/v*
    # branches and v* tags.
    environment:
      name: ci-s3-tests
      deployment: false
    needs: [start-validation-runner, discover-fvdb-core, validate-smoke-test, pr-flags]
    if: ${{ !cancelled() && needs.validate-smoke-test.result == 'success' && (needs.pr-flags.outputs.release_push == 'true' || inputs.run_validation == true) }}
    runs-on: ${{ needs.start-validation-runner.outputs.label }}
    container:
      image: nvidia/cuda:${{ needs.discover-fvdb-core.outputs.cuda-image-tag }}-base-rockylinux8
      env:
        PYTHONPATH: ""
        SSL_CERT_FILE: /etc/pki/tls/certs/ca-bundle.crt
      options: --rm
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Install prerequisites
        run: dnf install -y git wget procps-ng findutils ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.7.5"

      - name: Set up Python
        run: |
          uv python install 3.12
          uv venv

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fvdb-rc-dist
          path: dist

      - name: Download the fvdb-core wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fvdb-core-staging-wheel
          path: core-wheel

      - name: Install fvdb-core from S3 staging
        run: |
          uv pip install --no-cache \
            torch==${{ needs.discover-fvdb-core.outputs.torch-version }} torchvision \
            --extra-index-url ${{ needs.discover-fvdb-core.outputs.pytorch-index }}
          uv pip install --no-cache core-wheel/fvdb_core-*.whl

      - name: Install fvdb-reality-capture with test dependencies
        run: |
          WHEEL=$(ls dist/fvdb_reality_capture-*.whl)
          uv pip install "${WHEEL}[benchmark,test]"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::420032683002:role/openvdb-fvdb-github-actions-test-data
          aws-region: us-east-2

      - name: Run unit and benchmark contract tests
        run: |
          cd tests
          ../.venv/bin/python -m pytest -v unit benchmarks/test_benchmark_contract.py benchmarks/test_comparison_benchmark.py

  stop-validation-runner:
    permissions:
      id-token: write # AWS OIDC, to start or stop the runner
    name: Stop GPU EC2 runner for validation
    needs:
      - start-validation-runner
      - validate-smoke-test
      - validate-unit-tests
    if: ${{ always() && needs.start-validation-runner.result != 'skipped' && needs.start-validation-runner.outputs.ec2-instance-id != '' }}
    uses: ./.github/workflows/stop-ec2-runner.yml
    secrets: inherit # zizmor: ignore[secrets-inherit] the runner App key reaches the runner jobs this way; see start-ec2-runner.yml
    with:
      label: ${{ needs.start-validation-runner.outputs.label }}
      ec2-instance-id: ${{ needs.start-validation-runner.outputs.ec2-instance-id }}
