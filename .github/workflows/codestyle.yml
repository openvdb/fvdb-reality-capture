name: fVDB Code Style
on:
    pull_request:
      branches:
        - main

# Allow subsequent pushes to the same PR or REF to cancel any previous jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-python-black-lint:
    name: Check Python code style with black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          options: "--check --verbose --target-version=py311 --line-length=120"
          src: "./"
          version: "~= 24.0"

  # NOTE: Enable this when/if we have C++ code
  # test-cpp-clang-format-lint:
  #   name: Check C++ code style with clang-format
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v4
  #   - uses: DoozyX/clang-format-lint-action@v0.18.2
  #     with:
  #       extensions: 'h,cpp,cc,cu,cuh'
  #       clangFormatVersion: 18
  #       style: file

  include-guards:
    name: Check include guards
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: swahtz/include-guards-check-action@master

  check-spdx-identifiers:
    name: Check SPDX identifiers
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - uses: enarx/spdx@master
      with:
        licenses: |-
          Apache-2.0
          MIT

  # Search the git repository for any trailing spaces excluding auto-generated wlt files
  # NOTE: Migrated from openvdb whitespace.yml
  trailingspaces:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: test
      run: |
          set +e
          git grep -n -I -E '^.+[ ]+$' -- ':!*.wlt'
          test $? -eq 1

  # Search for any tabs excluding meeting notes, image files and a few others
  # NOTE: Migrated from openvdb whitespace.yml
  spacesnottabs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: test
      run: |
          set +e
          git grep -n "	" -- ':!*/codestyle.yml' ':!*.svg' ':!*.cmd' ':!*.png' ':!*.wlt' ':!*.jpg' ':!*.gif' ':!*.mp4' ':!*.pt' ':!*.pth' ':!*.nvdb' ':!*.npz' ':!*.gitmodules'
          test $? -eq 1

  # The nightly builds the fvdb-core wheel from fvdb-core's env/build_environment.yml
  # and installs it into the benchmark env in this repo. If those pins disagree the
  # wheel is compiled against one libtorch and loaded against another, and the run
  # dies at `import fvdb`. The nightly regenerates the pins itself, so a stale file
  # no longer breaks CI -- but it still breaks `docker build` and anyone creating the
  # env locally, so keep the committed file honest here.
  #
  # This blocks rather than warns: a GitHub `::warning::` is an annotation, so a
  # green check would hide it and the staleness would persist.
  check-benchmark-env-current:
    name: Benchmark env pins current
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check pins match fvdb-core
      run: python3 scripts/generate_benchmark_env.py --check

