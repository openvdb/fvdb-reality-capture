#
# De-register and terminate a self-hosted EC2 runner started by
# start-ec2-runner.yml. Callers keep their own `needs:` and
# `if: always() && needs.<start-job>.result != 'skipped'` guards; this workflow
# is only the teardown itself.
name: Stop EC2 Runner

on:
  workflow_call:
    inputs:
      label:
        description: Runner label emitted by start-ec2-runner.yml.
        type: string
        required: true
      ec2-instance-id:
        description: Instance id emitted by start-ec2-runner.yml.
        type: string
        required: true
      aws-role:
        description: IAM role to assume via OIDC. Can only start and stop runners.
        type: string
        required: false
        default: arn:aws:iam::420032683002:role/openvdb-fvdb-github-actions-ec2-runners
      aws-region:
        description: AWS region the instance is running in.
        type: string
        required: false
        default: us-east-2

permissions:
  id-token: write # Need ID token write permission to use OIDC

jobs:
  stop:
    name: Stop EC2 runner
    runs-on: ubuntu-latest
    # The runner role (the aws-role default above) trusts only OIDC tokens
    # whose subject names the ci-aws environment, and a job's token names an
    # environment only if the job declares one. ci-aws has no required
    # reviewers; its deployment-branch policy limits which refs can start a
    # runner. Approval of external PRs happens earlier, in approval-gate.yml.
    #
    # deployment: false keeps the environment (its deployment-branch policy
    # still applies and the OIDC subject still names ci-aws) but records no
    # deployment, so PRs are not filled with "deployed to ci-aws" events.
    # Both were verified in openvdb/fvdb-test.
    environment:
      name: ci-aws
      deployment: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
          # 900s is the STS minimum. This job finishes in seconds, so a leaked
          # session is useful for 15 minutes instead of the default hour.
          role-duration-seconds: 900

      # The runner action needs a token that can register and remove this
      # repository's self-hosted runners (Administration: write). It comes from
      # the fvdb-ec2-runners GitHub App: minted for this job, limited to this
      # repository, and revoked when the job ends. The App's private key is a
      # secret of the ci-aws environment, so only jobs that declare ci-aws, on
      # refs its deployment-branch policy allows, can read it.
      - name: Mint a runner-registration token
        id: runner-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RUNNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RUNNER_APP_KEY }}
          permission-administration: write

      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.runner-app-token.outputs.token }}
          label: ${{ inputs.label }}
          ec2-instance-id: ${{ inputs.ec2-instance-id }}
