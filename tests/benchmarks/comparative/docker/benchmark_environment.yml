name: benchmark
channels:
  - conda-forge
  - nodefaults
dependencies:
  - blas=*=mkl
  - ca-certificates
  - certifi
  - cmake
  - cuda-command-line-tools
  - cuda-compiler
  - cuda-cudart-dev
  - cuda-nvrtc-dev
  - cuda-nvtx-dev
  - cuda-version=13.0
  - cxx-compiler
  - gcc_linux-64=13
  - git
  - gitpython
  - gxx_linux-64=13
  - imageio
  - ipython
  - libcublas-dev
  - libcurand-dev
  - libcusolver-dev
  - libcusparse-dev
  - libpng
  - linkify-it-py
  - make
  - matplotlib
  - msgpack-python
  - myst-parser
  - ninja
  - numpy
  - openssl
  - openusd
  - pandas
  - parameterized
  - pip
  - pkg-config
  - polyscope
  - psutil
  - pybind11
  - py-opencv>=4.10[build=headless*]
  # Upper bound pending conda-forge pycolmap 4.x / libfaiss ABI fix: the 4.x conda builds
  # declare only `libfaiss >=1.9.0,<2`, which is looser than faiss's actual ABI stability.
  # libfaiss 1.14.3 (cuda130, uploaded 2026-08-04) satisfies that pin but drops the
  # faiss::IndexIVFFlat ctor symbol pycolmap 4.1.1 was built against, so `import pycolmap`
  # fails with an undefined symbol. The PyPI wheels are self-contained and unaffected, so
  # this bound is deliberately scoped to the conda benchmark env and not to pyproject.toml.
  - pycolmap>=3.11,<4
  - pytest-benchmark
  - python=3.12
  # python, cuda-version and pytorch-gpu are DERIVED from fvdb-core's
  # env/build_environment.yml -- the environment its wheel is compiled in. A
  # mismatch is an ABI break (undefined libtorch symbols at `import fvdb`), not a
  # version warning. Do not hand-edit these three; run:
  #     scripts/generate_benchmark_env.py                 # match fvdb-core main
  #     scripts/generate_benchmark_env.py --from-local ../fvdb-core
  - pytorch-gpu=2.13.0
  - rich
  - scikit-build-core
  - scikit-learn
  - seaborn
  - setuptools>=68.2.2
  - sphinx_rtd_theme
  - sphinx>=7.0.0
  - tensorboard
  - torchvision
  - tqdm
  - zlib
  ## 3dgs
  - boto3
  - gdal
  - pillow
  - pyproj
  - pyyaml
  - scikit-image
  - viser
  - pip:
    - point-cloud-utils
    - pytest-markdown-docs
    - oiio-static-python
    - dlnr_lite
    - einops
    ## comparative benchmark extras
    - piexif
    - splines
    - nerfview @ git+https://github.com/nerfstudio-project/nerfview@4538024fe0d15fd1a0e4d760f3695fc44ca72787
    - torchmetrics
    - sam2==1.1.0
